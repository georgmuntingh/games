<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell Digital Twin — tests</title>
    <link rel="stylesheet" href="/shared/ui.css" />
    <style>
      main { max-width: 820px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
      .result { display: flex; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid var(--ui-border); }
      .badge { font-weight: 700; }
      .pass .badge { color: #16a34a; }
      .fail .badge { color: #dc2626; }
      .detail { color: var(--ui-muted); font-size: 0.85rem; font-family: ui-monospace, monospace; }
      .summary { font-size: 1.1rem; font-weight: 600; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <a class="back-link" href="../">← Back to Cell Digital Twin</a>
    <main>
      <h1>Cell Digital Twin — test suite</h1>
      <p class="detail">
        Validates the flux laws (GHK/Nernst), the integrator (Rush–Larsen),
        mass &amp; charge conservation, the erythrocyte resting steady state, and
        perturbation responses.
      </p>
      <div id="summary" class="summary">Running…</div>
      <div id="results"></div>
    </main>
    <script type="module">
      import params from '../data/erythrocyte.params.json';
      import { runAll } from './suite.js';
      const results = runAll(params);
      const box = document.getElementById('results');
      let failed = 0;
      for (const r of results) {
        if (!r.pass) failed++;
        const div = document.createElement('div');
        div.className = 'result ' + (r.pass ? 'pass' : 'fail');
        div.innerHTML = `<span class="badge">${r.pass ? '✓' : '✗'}</span>` +
          `<span><div>${r.name}</div><div class="detail">${r.detail}</div></span>`;
        box.appendChild(div);
      }
      const s = document.getElementById('summary');
      s.textContent = `${results.length - failed} / ${results.length} passed`;
      s.style.color = failed ? '#dc2626' : '#16a34a';
    </script>
  </body>
</html>
